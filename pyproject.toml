[project]
name = "rss-forward"
version = "1.0.1"
description = "scrap online data and share it as RSS feed"
keywords = ["RSS", "feed", "web scrap"]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    ## separate 'name' and 'email' hack to fill "Author:" and "Author-email:" fields
    { name = "Arkadiusz Netczuk" }, { email = "dev.arnet@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keepassxc-browser >= 0.1.8",
    "librus_apix==1.5.1",
    "feedgen>=0.9.0",
    "appdirs>=1.4.4",
    "toml>=0.10.2",
    "pytz>=2021.3",
    "requests>=2.31.0",
    "pycurl==7.45.3",
    "pystray==0.19.5",
    "yt-dlp",
    "selenium",
    "webdriver-manager"    
]

[project.urls]
Homepage = "https://github.com/anetczuk/rss-forward"
Repository = "https://github.com/anetczuk/rss-forward"

[project.optional-dependencies]
dev = [
    ### dependencies for "tools" scripts

    "xmltodict",    ## for mdpreproc.py

    "black",
    "pycodestyle",
    "flake8",
    "pylint",
    "ruff",
    "complexipy",
    "bandit",
    "codespell",
    "shellcheck_py",
    "pydocstyle",
    "mypy",
    "coverage",             ## for coverage.sh
    "mdlinkscheck",

    ## for profiling (tools/profiler.sh)
    "pyprof2calltree",   
    "snakeviz",
    "mtprof",
    "viztracer",
]

[project.scripts]
## define run scripts: <exec-name> = <python-function>
rssforward = "rssforward.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
## install pointed scripts to /bin directory
# script-files = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["rssforward*"]

[tool.setuptools.package-data]
## assign list of additional files to given Python packages
rssforward = [ "*.png" ]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
